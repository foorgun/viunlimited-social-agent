name: Instagram posten

on:
  schedule:
    # Di und Fr um 07:00 UTC = 08:00 Uhr Winterzeit / 09:00 Uhr Sommerzeit
    - cron: "0 7 * * 2,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen, nichts posten"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # Pause: Repository-Variable PAUSED auf "true" setzen
    if: vars.PAUSED != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nächsten Carousel posten
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/posts
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: python scripts/post_instagram.py

      - name: Veröffentlichte Posts speichern
        run: |
          if ! git diff --quiet state/published.json; then
            git config user.name "viunlimited-social-agent"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/published.json
            git commit -m "Veröffentlicht: $(python -c 'import json;print(json.load(open("state/published.json"))["published"][-1]["id"])')"
            git push
          fi
